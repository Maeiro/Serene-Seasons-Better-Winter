ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="sereneseasons"
mandatory=false
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="dynamic_trees"
mandatory=false
versionRange="[0,)"
ordering="AFTER"
side="BOTH"
